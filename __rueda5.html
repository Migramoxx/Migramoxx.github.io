<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Prototipos: se sirven para poder verlos y enlazarlos, pero no compiten
     en el buscador. Los cuatro comparten titulo, y cuatro paginas con el
     mismo titulo bajo el dominio propio se leen como contenido duplicado.
     `follow`: los enlaces que tengan adentro se siguen igual. -->
<meta name="robots" content="noindex, follow" />
<title>Navegación circular 360° — 5 ítems</title>

<!--
  RUEDA 360 — navegación circular escalable.

  La idea que sostiene todo es la DOBLE ROTACIÓN:

    1. El anillo orbital rota  A = -activo * (360 / N)  grados.
    2. Cada satélite aplica la rotación inversa exacta, -A, así su
       contenido nunca queda de cabeza.

  Cada satélite lleva además su propio par de rotaciones de posición:

       rotate(θ) translateY(-R) rotate(-θ)

  θ lo pone JS una sola vez, leyendo cuántos nodos hay en el HTML. Por eso
  agregar o sacar un satélite es agregar o sacar un <button>: no hay ninguna
  constante que actualizar. Probado con 5, 8 y 20.

  Nota de implementación: la contrarrotación se escribe en CADA satélite, no
  se hereda de una variable del anillo. Una variable en el ancestro obliga al
  navegador a recalcular el estilo de todos los descendientes cada vez que
  cambia; acá el valor es el mismo para todos, pero escribirlo directo deja el
  costo donde se ve y no crece con lo que haya dentro de cada nodo.
-->

<style>
  /* ─────────────────────────── el sistema ─────────────────────────── */
  :root {
    /* Curvas. No son las de CSS: las nativas son demasiado flojas y a este
       recorrido, que es largo, se le nota. */
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

    /* El giro. 420ms es más de lo que dura una UI normal, y acá está
       justificado: no es un menú que aparece, es una masa que recorre un
       arco. A 200ms se lee como un salto y se pierde de dónde vino, que es
       justamente lo único que esta animación tiene que comunicar.
       JS lo estira un poco cuando el salto es de varias posiciones. */
    --dur-turn: 420ms;
    --dur-press: 140ms;
    --dur-swap: 260ms;

    /* Modo oscuro. Dos superficies y un acento; nada más, para que el ojo
       tenga un solo lugar donde volver. */
    --bg: #0b0d10;
    --surface: #14171c;
    --surface-hi: #1c212a;
    --line: rgb(255 255 255 / 9%);
    --line-hi: rgb(255 255 255 / 22%);
    --ink: #e9edf2;
    --ink-mute: #858d99;
    --accent: #7ee0c4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Un resplandor muy tenue detrás de la rueda. Es lo único decorativo del
     archivo: despega el conjunto del fondo plano sin pedir atención. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(
      60vmin 60vmin at 50% 44%,
      rgb(126 224 196 / 6%),
      transparent 70%
    );
    pointer-events: none;
  }

  /* ─────────────────────────── el lienzo ─────────────────────────── */
  /* La geometría vive ACÁ y no en :root, por dos motivos. Uno práctico: `--n`
     lo escribe JS en este elemento, y las variables heredan hacia abajo, no
     hacia arriba — calculado en :root, el tamaño del nodo nunca se enteraba de
     cuántos nodos hay. Uno de diseño: así dos ruedas con distinta cantidad
     pueden convivir en la misma página sin pisarse. */
  .wheel {
    --wheel: clamp(300px, 72vmin, 540px);
    --node-base: clamp(62px, 15.5vmin, 104px);
    --node: var(--node-base);
    /* El satélite activo crece un 10% y lleva un halo de 6px. Si el radio se
       calcula con el nodo en reposo, al girar el activo se sale del lienzo y
       la página gana barras de scroll. Se descuenta el nodo YA CRECIDO. */
    --node-active-scale: 1.1;
    --radius: calc(
      var(--wheel) / 2 - (var(--node) * var(--node-active-scale)) / 2 - 7px
    );
    --hub: calc(var(--wheel) * 0.46);

    position: relative;
    width: var(--wheel);
    height: var(--wheel);
    display: grid;
    place-items: center;
    /* El anillo es un cuadrado del tamaño del lienzo, y un cuadrado girado 45°
       mide √2 veces más de lado a lado. Aunque no se vea, esa caja empuja el
       documento y la página gana barras de scroll a mitad del giro. `clip` y
       no `hidden`: recorta igual pero no convierte esto en un contenedor
       scrolleable, así un foco dentro no puede desplazarlo. */
    overflow: clip;
  }

  /* El tamaño del satélite NO puede ser fijo si la rueda tiene que escalar.
     La distancia entre dos vecinos es la cuerda del arco, 2·R·sin(180°/N): a
     ocho nodos sobra lugar, a veinte se pisan. Acá el nodo se achica solo
     cuando entran más, usando `sin()` de CSS — sin JS y sin escuchar resize.
     `--n` lo escribe JS, que ya cuenta los nodos para todo lo demás.

     El 1.25 sale de que el radio real es menor que el nominal (le descuenta
     medio nodo), así que sobrestimar la cuerda acá compensa y deja aire. */
  @supports (width: calc(sin(45deg) * 1px)) {
    .wheel {
      --node-fit: calc(1.25 * (var(--wheel) / 2) * sin(180deg / var(--n, 8)));
      --node: min(var(--node-base), var(--node-fit));
    }
  }

  /* La marca de las 12. Sin esto la rueda gira pero no se entiende dónde
     aterriza lo que elegiste. */
  .wheel__mark {
    position: absolute;
    top: 0;
    left: 50%;
    width: 2px;
    height: 0.75rem;
    margin-left: -1px;
    border-radius: 1px;
    background: var(--line-hi);
  }

  /* ── el anillo orbital: invisible, sólo existe para girar ── */
  .wheel__ring {
    position: absolute;
    inset: 0;
    transform: rotate(var(--ring-angle, 0deg));
    transition: transform var(--dur-turn) var(--ease-in-out);
    will-change: transform;
  }

  /* ── los satélites ── */
  .wheel__node {
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--node);
    height: var(--node);
    margin: calc(var(--node) / -2);
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    border-radius: 50%;
    /* Posición sobre el anillo. Constante: JS la escribe una sola vez. El
       tercer rotate endereza el nodo respecto del anillo; el anillo todavía
       lo va a girar, y de eso se ocupa .wheel__face. */
    transform: rotate(var(--angle)) translateY(calc(var(--radius) * -1))
      rotate(calc(var(--angle) * -1));
  }

  /* ── LA CONTRARROTACIÓN ── */
  .wheel__face {
    display: grid;
    place-items: center;
    gap: 0.15rem;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line);
    /* --counter = -(ángulo del anillo). Lo escribe JS en cada satélite. */
    transform: rotate(var(--counter, 0deg)) scale(var(--face-scale, 1));
    transition:
      transform var(--dur-turn) var(--ease-in-out),
      background-color var(--dur-turn) var(--ease-out),
      border-color var(--dur-turn) var(--ease-out),
      box-shadow var(--dur-turn) var(--ease-out);
  }

  .wheel__icon {
    font-size: clamp(0.95rem, 2.6vmin, 1.25rem);
    line-height: 1;
    color: var(--ink-mute);
    transition: color var(--dur-turn) var(--ease-out);
  }

  .wheel__label {
    font-size: clamp(0.58rem, 1.7vmin, 0.72rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-mute);
    transition: color var(--dur-turn) var(--ease-out);
  }

  /* Rueda densa: a partir de una docena de satélites el nombre no entra en el
     círculo, y veinte nombres a la vez son exactamente la carga cognitiva que
     esto tiene que evitar. Queda el ícono como identidad; el nombre lo dice el
     hub, que para eso está. */
  .wheel[data-dense] .wheel__label { display: none; }
  .wheel[data-dense] .wheel__icon { font-size: clamp(1rem, 3vmin, 1.4rem); }

  /* El que está a las 12. Sube de superficie, no de color: la jerarquía la
     hace el contraste, y así no hay dos acentos peleando con el hub. */
  .wheel__node[aria-current="true"] .wheel__face {
    --face-scale: var(--node-active-scale);
    background: var(--surface-hi);
    border-color: var(--line-hi);
    box-shadow: 0 0 0 6px rgb(126 224 196 / 6%);
  }
  .wheel__node[aria-current="true"] .wheel__icon { color: var(--accent); }
  .wheel__node[aria-current="true"] .wheel__label { color: var(--ink); }

  /* El hover sólo cuenta si hay un puntero de verdad: en pantalla táctil un
     toque deja el nodo "hovereado" para siempre. */
  @media (hover: hover) and (pointer: fine) {
    .wheel__node:hover .wheel__face { border-color: var(--line-hi); }
    .wheel__node:hover .wheel__label,
    .wheel__node:hover .wheel__icon { color: var(--ink); }
  }

  .wheel__node:active .wheel__face { --face-scale: 0.94; }
  .wheel__node[aria-current="true"]:active .wheel__face { --face-scale: 1.04; }
  .wheel__node:active .wheel__face { transition-duration: var(--dur-press); }

  .wheel__node:focus-visible { outline: none; }
  .wheel__node:focus-visible .wheel__face {
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
  }

  /* ── el hub: fijo, nunca rota ── */
  .wheel__hub {
    position: relative;
    z-index: 1;
    width: var(--hub);
    height: var(--hub);
    border-radius: 50%;
    background: radial-gradient(
      100% 100% at 50% 0%,
      var(--surface-hi),
      var(--surface)
    );
    border: 1px solid var(--line);
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0.25rem;
    padding: 0 clamp(0.4rem, 2.2vmin, 0.9rem);
    text-align: center;
  }

  .wheel__kicker {
    margin: 0 0 0.35rem;
    font-size: clamp(0.52rem, 1.5vmin, 0.65rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .wheel__title {
    margin: 0;
    font-size: clamp(1.1rem, 4.4vmin, 1.9rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .wheel__count {
    margin: 0.45rem 0 0;
    font-size: clamp(0.55rem, 1.5vmin, 0.68rem);
    letter-spacing: 0.12em;
    color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
  }

  .wheel__arrow {
    width: clamp(1.9rem, 5.4vmin, 2.5rem);
    height: clamp(1.9rem, 5.4vmin, 2.5rem);
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgb(255 255 255 / 3%);
    color: var(--ink-mute);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    transition:
      transform var(--dur-press) var(--ease-out),
      color var(--dur-press) var(--ease-out),
      border-color var(--dur-press) var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .wheel__arrow:hover { color: var(--ink); border-color: var(--line-hi); }
  }

  .wheel__arrow:active { transform: scale(0.9); }

  .wheel__arrow:focus-visible {
    outline: none;
    color: var(--ink);
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* ── movimiento reducido ──
     Menos y más suave, no cero: el estado sigue cambiando y el activo sigue
     yendo a las 12, pero sin el viaje. Lo que se conserva es lo que informa
     (color, contraste); lo que se va es el desplazamiento. */
  @media (prefers-reduced-motion: reduce) {
    :root { --dur-turn: 1ms; }
    .wheel__face { --face-scale: 1 !important; }
    .wheel__node[aria-current="true"] .wheel__face { --face-scale: 1 !important; }
    .wheel__arrow:active { transform: none; }
  }
</style>
</head>

<body>
  <!-- Los satélites van escritos en el HTML, no generados por JS: así se leen
       de un vistazo, funcionan sin JS y agregar uno es agregar un <button>.
       JS cuenta cuántos hay y deriva el resto. -->
  <nav class="wheel" data-wheel aria-label="Categorías">
    <span class="wheel__mark" aria-hidden="true"></span>

    <div class="wheel__ring" data-ring>
      <button class="wheel__node" type="button">
        <span class="wheel__face" data-face>
          <span class="wheel__icon" aria-hidden="true">◉</span>
          <span class="wheel__label">Films1</span>
        </span>
      </button>
      <button class="wheel__node" type="button">
        <span class="wheel__face" data-face>
          <span class="wheel__icon" aria-hidden="true">▤</span>
          <span class="wheel__label">Series2</span>
        </span>
      </button>
      <button class="wheel__node" type="button">
        <span class="wheel__face" data-face>
          <span class="wheel__icon" aria-hidden="true">◈</span>
          <span class="wheel__label">Sports3</span>
        </span>
      </button>
      <button class="wheel__node" type="button">
        <span class="wheel__face" data-face>
          <span class="wheel__icon" aria-hidden="true">✳</span>
          <span class="wheel__label">Kids4</span>
        </span>
      </button>
      <button class="wheel__node" type="button">
        <span class="wheel__face" data-face>
          <span class="wheel__icon" aria-hidden="true">♪</span>
          <span class="wheel__label">Music5</span>
        </span>
      </button>
    </div>

    <div class="wheel__hub">
      <button class="wheel__arrow" type="button" data-step="-1" aria-label="Categoría anterior">‹</button>
      <div>
        <p class="wheel__kicker">Now showing</p>
        <!-- aria-live y no un aria-label en la rueda: el cambio de categoría
             es lo que hay que anunciar, y sólo cuando pasa. -->
        <h2 class="wheel__title" data-title aria-live="polite">Films</h2>
        <p class="wheel__count" data-count>01 / 08</p>
      </div>
      <button class="wheel__arrow" type="button" data-step="1" aria-label="Categoría siguiente">›</button>
    </div>
  </nav>

<script>
(() => {
  "use strict";

  const wheel = document.querySelector("[data-wheel]");
  const ring = wheel.querySelector("[data-ring]");
  const title = wheel.querySelector("[data-title]");
  const count = wheel.querySelector("[data-count]");
  const nodes = [...ring.querySelectorAll(".wheel__node")];

  const N = nodes.length;
  const STEP = 360 / N;                 // el ángulo entre satélites
  const EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
  const BASE_TURN = 420;                // ms, igual que --dur-turn

  const quieto = matchMedia("(prefers-reduced-motion: reduce)");

  /* ── estado ──
     `angulo` es ACUMULADO, nunca se normaliza a 0-360. Si se normalizara,
     pasar del último al primero haría que el anillo deshaga la vuelta entera
     hacia atrás en vez de seguir de largo: el camino corto en el índice
     dejaría de ser el camino corto en pantalla.

     `activo` es el DESTINO, no dónde está el anillo ahora. Se actualiza en el
     mismo clic, antes de que termine el giro anterior. Eso es lo que hace que
     cinco clics seguidos avancen cinco posiciones. */
  let activo = 0;
  let angulo = 0;

  /* ── lo que el CSS necesita saber de la cantidad ──
     `--n` le deja calcular el tamaño que entra; `data-dense` decide si los
     nombres caben en los satélites o los dice sólo el hub. */
  wheel.style.setProperty("--n", N);
  if (N > 12) wheel.setAttribute("data-dense", "");

  /* ── posiciones, una sola vez ──
     Cada satélite se entera de su ángulo y no vuelve a moverse: lo que gira
     es el anillo. */
  nodes.forEach((nodo, i) => {
    nodo.style.setProperty("--angle", `${i * STEP}deg`);
    nodo.addEventListener("click", () => ir(i));
  });

  /* ── camino más corto ──
     La diferencia se envuelve al rango [-N/2, N/2]. Con N par y una distancia
     de exactamente media vuelta hay empate: gana el sentido horario, que es
     la misma decisión que toma la flecha derecha. */
  function masCorto(desde, hasta) {
    let d = (hasta - desde) % N;
    if (d > N / 2) d -= N;
    if (d < -N / 2) d += N;
    return d;
  }

  /* ── el clic compulsivo ──
     Acá iba un bloqueo que ignoraba los clics mientras el anillo giraba. Se
     sacó: con `transition` (y no con keyframes) cambiar el destino a mitad de
     camino RE-APUNTA desde el valor actual, sin saltos y sin reiniciar. El
     bloqueo no evitaba nada que el navegador no evite solo, y sí se comía
     clics — cinco toques en la flecha avanzaban dos posiciones, porque los
     del medio se pisaban entre sí calculando su destino sobre un índice que
     ya estaba viejo.

     Lo que queda como guarda es lo único que hacía falta: un pedido que no
     mueve nada (`d === 0`) no dispara ninguna animación. */
  function ir(destino) {
    const d = masCorto(activo, destino);
    if (d === 0) return;

    /* Un salto de cinco posiciones recorre cinco veces más arco que uno de
       una. Con la misma duración se ve disparado; con duración proporcional
       completa, se arrastra. El compromiso: crece, pero cada vez menos, y con
       techo. */
    const dur = quieto.matches
      ? 1
      : Math.round(BASE_TURN * Math.min(1 + (Math.abs(d) - 1) * 0.16, 1.7));

    activo = (destino % N + N) % N;
    angulo -= d * STEP;

    wheel.style.setProperty("--dur-turn", `${dur}ms`);
    ring.style.setProperty("--ring-angle", `${angulo}deg`);

    /* LA CONTRARROTACIÓN. El anillo gira `angulo`; cada satélite gira
       exactamente lo contrario, así su cara queda siempre a plomo. Se escribe
       en cada nodo en vez de heredarse del anillo: ver la nota de arriba. */
    nodes.forEach((nodo) => {
      nodo.querySelector("[data-face]").style.setProperty("--counter", `${-angulo}deg`);
    });

    pintarHub(d > 0 ? 1 : -1);
  }

  function pintarHub(sentido) {
    nodes.forEach((nodo, i) => {
      nodo.setAttribute("aria-current", i === activo ? "true" : "false");
    });

    const etiqueta = nodes[activo].querySelector(".wheel__label").textContent;
    title.textContent = etiqueta;
    count.textContent = `${String(activo + 1).padStart(2, "0")} / ${String(N).padStart(2, "0")}`;

    if (quieto.matches) return;

    /* El título entra desde el lado del que viene el giro. WAAPI y no una
       clase: se puede cancelar la animación anterior en seco, que es lo que
       hace falta cuando alguien avanza tres veces seguidas. */
    title.getAnimations().forEach((a) => a.cancel());
    title.animate(
      [
        { opacity: 0, transform: `translateY(${sentido * 8}px)` },
        { opacity: 1, transform: "translateY(0)" },
      ],
      { duration: 260, easing: EASE_OUT, fill: "both" }
    );
  }

  /* ── entradas ── */
  wheel.querySelectorAll("[data-step]").forEach((boton) => {
    boton.addEventListener("click", () => {
      ir(activo + Number(boton.dataset.step));
    });
  });

  wheel.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { ir(activo + 1); e.preventDefault(); }
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") { ir(activo - 1); e.preventDefault(); }
    if (e.key === "Home") { ir(0); e.preventDefault(); }
    if (e.key === "End") { ir(N - 1); e.preventDefault(); }
  });

  /* ── primer cuadro ──
     Sin transición: la posición inicial no es un movimiento, es un estado. */
  const antes = wheel.style.getPropertyValue("--dur-turn");
  wheel.style.setProperty("--dur-turn", "0ms");
  nodes.forEach((nodo) => {
    nodo.querySelector("[data-face]").style.setProperty("--counter", "0deg");
  });
  pintarHub(1);
  title.getAnimations().forEach((a) => a.cancel());
  requestAnimationFrame(() => {
    wheel.style.setProperty(
      "--dur-turn",
      antes || (quieto.matches ? "1ms" : `${BASE_TURN}ms`)
    );
  });
})();
</script>
</body>
</html>
